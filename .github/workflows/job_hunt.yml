name: H1B Job Hunt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,18 * * *"

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p output config
      - run: python job_hunter.py
        env:
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          YOUR_EMAIL: ${{ secrets.YOUR_EMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RESUME_URL: ${{ secrets.RESUME_URL }}
          # VISA_MODE: set to "h1b", "opt_cpt", "stem_opt", or "all" (default: all)
          VISA_MODE: ${{ secrets.VISA_MODE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-tracker-${{ github.run_number }}
          path: output/job_tracker.xlsx
          retention-days: 30
